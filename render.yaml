services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: vcube-directory-api
    env: docker
    dockerfilePath: ./demo/Dockerfile
    dockerContext: ./demo
    plan: free
    healthCheckPath: /dmo/get
    envVars:
      - key: PORT
        value: 5000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # 2. React Vite Frontend Static Site
  - type: web
    name: vcube-directory-app
    env: static
    buildCommand: cd demo-frontend && npm install && npm run build
    staticPublishPath: ./demo-frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: vcube-directory-api
          property: host
