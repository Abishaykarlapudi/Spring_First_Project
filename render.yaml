services:
  # Unified Fullstack Service (Spring Boot + React UI embedded)
  - type: web
    name: vcube-directory-app
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /dmo/get
    envVars:
      - key: PORT
        value: 5000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
